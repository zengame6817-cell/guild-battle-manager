<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>ギルド対戦管理 v2.1</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <strong>ギルド対戦管理</strong>
      <span class="version">v2.1</span>
      <span id="connectionStatus" class="status loading">接続中</span>
    </div>

    <div class="top-actions">
      <select id="modeSelect" aria-label="モード">
        <option value="normal">通常</option>
        <option value="z">Z</option>
      </select>
      <button id="refreshButton" type="button" class="refresh" aria-label="手動更新">↻</button>
    </div>
  </header>

  <main class="app">
    <section class="controlbar">
      <div id="guildSelectors" class="guilds"></div>
      <input id="searchInput" class="search" type="search" placeholder="名前検索">
      <select id="statusFilter" class="filter" aria-label="表示条件">
        <option value="all">すべて</option>
        <option value="remaining">未完了</option>
        <option value="done1">1投済</option>
        <option value="done2">2投済</option>
        <option value="unassigned">未配置</option>
      </select>
    </section>

    <section id="summary" class="summary"></section>

    <nav class="tabs">
      <button class="tab active" data-tab="members" type="button">メンバー</button>
      <button class="tab" data-tab="battle" type="button">戦力比較</button>
      <button class="tab" data-tab="enemies" type="button">相手配置</button>
    </nav>

    <section id="membersPanel" class="panel active"></section>
    <section id="battlePanel" class="panel"></section>
    <section id="enemiesPanel" class="panel"></section>
  </main>

  <nav class="bottom-nav">
    <button class="bottom-tab active" data-tab="members" type="button">メンバー</button>
    <button class="bottom-tab" data-tab="battle" type="button">戦力比較</button>
    <button class="bottom-tab" data-tab="enemies" type="button">相手配置</button>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
